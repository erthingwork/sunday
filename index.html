<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웹페이지 레이아웃</title>
    <style>
        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            background-color: f4f4f4;
        }

        .hero-image {
            width: 100%;
            height: 400px; / 원하는 높이로 조절 /
            background-image: url('your-wide-image.jpg'); / 실제 이미지 경로로 변경 /
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .stats-section {
            width: 100%;
            padding: 20px 0;
            background-color: ffffff;
            text-align: center;
        }

        .stats-section h2 {
            margin-bottom: 20px;
            color: 333;
        }

        .stats-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            padding: 0 20px;
        }

        .stat-item {
            background-color: e0e0e0;
            color: 333;
            padding: 8px 15px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .stat-item:hover {
            background-color: c0c0c0;
        }

        .cards-section {
            padding: 40px 20px;
            background-color: f4f4f4;
        }

        .cards-section h2 {
            text-align: center;
            margin-bottom: 30px;
            color: 333;
        }

        .cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); / 웹사이트 width에 따라 가변 /
            gap: 20px;
            max-width: 1200px; / 최대 너비 설정 /
            margin: 0 auto;
        }

        .card {
            background-color: ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 200px; / 카드 최소 높이 /
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        }

        .card-header {
            background-color: 4CAF50; / 카드 헤더 색상 /
            color: white;
            padding: 15px;
            font-size: 1.2em;
            font-weight: bold;
        }

        .card-content {
            padding: 15px;
            flex-grow: 1; / 내용이 늘어나도록 /
        }

        .card-content p {
            margin: 0 0 10px 0;
            color: 555;
        }

        .card-content ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .card-content li {
            margin-bottom: 5px;
            color: 666;
        }

        .sheet-section {
            width: 100%;
            padding: 20px 0;
            background-color: 333;
            color: white;
            text-align: center;
            font-size: 0.9em;
        }

        .sheet-section p {
            margin: 0;
            padding: 0 20px;
            display: inline-block; / 텍스트가 길어도 한 줄로 보이도록 /
        }

        / 카드 클릭 시 확대/편집 모드 (예시) /
        .card.expanded {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(1.2); / 확대 효과 /
            z-index: 1000;
            box-shadow: 0 16px 32px rgba(0,0,0,0.3);
            width: 80%; / 확대 시 너비 /
            max-width: 600px; / 최대 너비 /
            height: auto; / 높이 자동 조절 /
        }

        / 편집 가능 상태를 위한 추가 스타일 (선택 사항) /
        .card.expanded .card-content textarea {
            width: 100%;
            height: 150px; / 편집 영역 높이 /
            padding: 10px;
            border: 1px solid ccc;
            border-radius: 4px;
            box-sizing: border-box;
            resize: vertical; / 세로 크기 조절 가능 /
            font-family: 'Arial', sans-serif;
            font-size: 1em;
        }
    </style>
</head>
<body>

    <header class="hero-image">
        <h1>[웹사이트 제목 또는 슬로건]</h1>
    </header>

    <section class="stats-section">
        <h2>주요 스탯</h2>
        <div class="stats-container">
            <span class="stat-item">스탯 1</span>
            <span class="stat-item">스탯 2</span>
            <span class="stat-item">스탯 3</span>
            <span class="stat-item">스탯 4</span>
            <span class="stat-item">스탯 5</span>
        </div>
    </section>

    <section class="cards-section">
        <h2>데이터 카드</h2>
        <div class="cards-container">
            <div class="card">
                <div class="card-header">아이템 이름 1</div>
                <div class="card-content">
                    <p>간단한 설명:</p>
                    <ul>
                        <li>속성 A: 값</li>
                        <li>속성 B: 값</li>
                    </ul>
                </div>
            </div>
            <div class="card">
                <div class="card-header">아이템 이름 2</div>
                <div class="card-content">
                    <p>간단한 설명:</p>
                    <ul>
                        <li>속성 C: 값</li>
                        <li>속성 D: 값</li>
                        <li>속성 E: 값</li>
                    </ul>
                </div>
            </div>
            <div class="card">
                <div class="card-header">아이템 이름 3</div>
                <div class="card-content">
                    <p>간단한 설명:</p>
                    <ul>
                        <li>속성 F: 값</li>
                    </ul>
                </div>
            </div>
            <div class="card">
                <div class="card-header">아이템 이름 4</div>
                <div class="card-content">
                    <p>간단한 설명:</p>
                    <ul>
                        <li>속성 G: 값</li>
                        <li>속성 H: 값</li>
                    </ul>
                </div>
            </div>
            <!-- 필요에 따라 더 많은 카드를 추가하세요 -->
        </div>
    </section>

    <footer class="sheet-section">
        <p>&copy; 2023 [회사명 또는 웹사이트 이름]. 모든 권리 보유.</p>
    </footer>

    <script>
        // 카드 클릭 시 확대/편집 모드 토글 (JavaScript 예시)
        document.querySelectorAll('.card').forEach(card => {
            card.addEventListener('click', () => {
                card.classList.toggle('expanded');
                // 편집 모드를 활성화하려면 여기에 추가 로직을 구현합니다.
                // 예를 들어, card-content 안의 내용을 textarea로 변경하거나
                // 편집 버튼을 추가할 수 있습니다.
            });
        });
    </script>

</body>
</html>
