<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웹페이지 레이아웃</title>
    <style>
        body {
            margin: 0;
            font-family: sans-serif;
        }
        .wide-image {
            width: 100%;
            height: 300px; / 이미지 높이 조절 /
            background-color: ccc; / 이미지 없을 경우 배경색 /
            background-size: cover;
            background-position: center;
        }
        .stats-section {
            padding: 20px;
            background-color: f4f4f4;
            text-align: center;
        }
        .stats-section h2 {
            margin-bottom: 20px;
        }
        .stat-item {
            display: inline-block;
            margin: 5px 10px;
            padding: 8px 15px;
            background-color: 007bff;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .stat-item:hover {
            background-color: 0056b3;
        }
        .cards-section {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            padding: 30px 10px;
            gap: 20px;
        }
        .card {
            width: 250px;
            border: 1px solid ddd;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .card:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .card-header {
            padding: 15px;
            background-color: f9f9f9;
            border-bottom: 1px solid ddd;
            font-weight: bold;
        }
        .card-content {
            padding: 15px;
        }
        .editable-card.expanded {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(1.2);
            z-index: 1000;
            width: 500px; / 확대 시 너비 /
            height: auto; / 확대 시 높이 자동 /
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
        .editable-card.expanded .card-content textarea {
            width: 100%;
            height: 150px; / 편집 가능한 영역 높이 /
            padding: 10px;
            border: 1px solid ccc;
            border-radius: 5px;
            resize: vertical;
            box-sizing: border-box;
        }
        .sheet-section {
            padding: 15px;
            background-color: 333;
            color: white;
            text-align: center;
            font-size: 0.9em;
        }
    </style>
</head>
<body>

    <div class="wide-image">
        <!-- 최상단 꽉찬 와이드 이미지 영역 -->
        <!-- background-image 스타일을 div에 직접 적용하거나, img 태그 사용 -->
    </div>

    <div class="stats-section">
        <h2>이름별 스탯</h2>
        <span class="stat-item">스탯 1</span>
        <span class="stat-item">스탯 2</span>
        <span class="stat-item">스탯 3</span>
        <span class="stat-item">스탯 4</span>
    </div>

    <div class="cards-section">
        <div class="card editable-card">
            <div class="card-header">이름 A</div>
            <div class="card-content">
                <p>카드 내용 1</p>
                <p>카드 내용 2</p>
            </div>
        </div>
        <div class="card editable-card">
            <div class="card-header">이름 B</div>
            <div class="card-content">
                <p>카드 내용 A</p>
                <p>카드 내용 B</p>
            </div>
        </div>
        <div class="card editable-card">
            <div class="card-header">이름 C</div>
            <div class="card-content">
                <p>카드 내용 X</p>
                <p>카드 내용 Y</p>
            </div>
        </div>
        <!-- 더 많은 카드 추가 가능 -->
    </div>

    <div class="sheet-section">
        <span>한 줄 요약 또는 중요 정보 시트</span>
    </div>

    <script>
        document.querySelectorAll('.editable-card').forEach(card => {
            card.addEventListener('click', function() {
                // 다른 카드가 이미 확대되어 있는지 확인
                const expandedCard = document.querySelector('.expanded');
                if (expandedCard && expandedCard !== this) {
                    expandedCard.classList.remove('expanded');
                    // 확대된 카드의 내용을 일반 텍스트로 되돌립니다.
                    const contentDiv = expandedCard.querySelector('.card-content');
                    contentDiv.innerHTML = contentDiv.dataset.originalContent;
                }

                this.classList.toggle('expanded');

                if (this.classList.contains('expanded')) {
                    const contentDiv = this.querySelector('.card-content');
                    // 원본 내용을 저장합니다.
                    contentDiv.dataset.originalContent = contentDiv.innerHTML;
                    // 편집 가능한 textarea로 변경합니다.
                    contentDiv.innerHTML = <textarea>${contentDiv.textContent.trim()}</textarea>;
                } else {
                    // 확대 해제 시 textarea의 내용을 일반 텍스트로 다시 표시합니다.
                    const contentDiv = this.querySelector('.card-content');
                    const textarea = contentDiv.querySelector('textarea');
                    if (textarea) {
                        contentDiv.innerHTML = textarea.value;
                    }
                }
            });
        });
    </script>

</body>
</html>
