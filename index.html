<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웹페이지 레이아웃</title>
    <style>
        body {
            margin: 0;
            font-family: sans-serif;
            background-color: #f4f4f4;
        }

        .wide-image-container {
            width: 100%;
            height: 300px; / 이미지 높이 조절 /
            overflow: hidden;
            position: relative;
        }

        .wide-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover; / 이미지가 컨테이너를 꽉 채우도록 /
        }

        .stats-section {
            padding: 20px;
            background-color: fff;
            text-align: center;
            margin-bottom: 20px;
        }

        .stats-section h2 {
            margin-top: 0;
            color: 333;
        }

        .stat-item {
            display: inline-block;
            margin: 5px 10px;
            padding: 8px 15px;
            background-color: e0e0e0;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .stat-item:hover {
            background-color: c0c0c0;
        }

        .cards-section {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            padding: 20px;
            gap: 20px;
        }

        .card {
            width: 250px;
            background-color: fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }

        .card-header {
            background-color: 007bff;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 1.2em;
            font-weight: bold;
        }

        .card-content {
            padding: 15px;
            text-align: center;
        }

        .card-content p {
            margin: 0 0 10px 0;
            color: 555;
        }

        .sheet-section {
            padding: 15px;
            background-color: 333;
            color: fff;
            text-align: center;
            font-size: 0.9em;
            position: sticky;
            bottom: 0;
            width: 100%;
        }

        / 카드 클릭 시 확대 및 편집 모드 (JavaScript로 구현 필요) /
        .card.expanded {
            width: 500px; / 확대될 너비 /
            height: auto; / 내용에 맞게 높이 조절 /
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
            box-shadow: 0 16px 32px rgba(0, 0, 0, 0.3);
        }

        .card.expanded .card-header,
        .card.expanded .card-content {
            padding: 20px;
        }

        .card.expanded .card-content textarea {
            width: 100%;
            height: 150px;
            margin-top: 10px;
            padding: 10px;
            border: 1px solid ccc;
            border-radius: 5px;
            font-family: sans-serif;
            font-size: 1em;
            resize: vertical; / 세로로만 크기 조절 가능 /
        }
    </style>
</head>
<body>

    <div class="wide-image-container">
        <img src="https://i.pinimg.com/1200x/ff/57/47/ff57477cca0a3f9d57aa78e1961f3767.jpg" alt="와이드 이미지">
    </div>

    <section class="stats-section">
        <h2>스탯</h2>
        <span class="stat-item">이름 1</span>
        <span class="stat-item">스탯 A</span>
        <span class="stat-item">스탯 B</span>
        <span class="stat-item">이름 2</span>
        <span class="stat-item">스탯 C</span>
        <span class="stat-item">스탯 D</span>
    </section>

    <section class="cards-section">
        <div class="card">
            <div class="card-header">이름 1</div>
            <div class="card-content">
                <p>관련 정보 1</p>
                <p>추가 정보 1</p>
            </div>
        </div>
        <div class="card">
            <div class="card-header">이름 2</div>
            <div class="card-content">
                <p>관련 정보 2</p>
                <p>추가 정보 2</p>
            </div>
        </div>
        <div class="card">
            <div class="card-header">이름 3</div>
            <div class="card-content">
                <p>관련 정보 3</p>
                <p>추가 정보 3</p>
            </div>
        </div>
        <!-- 더 많은 카드 추가 가능 -->
    </section>

    <div class="sheet-section">
        이것은 한 줄짜리 시트입니다.
    </div>

    <script>
        document.querySelectorAll('.card').forEach(card => {
            card.addEventListener('click', function() {
                // 이미 확대된 상태라면 해제
                if (this.classList.contains('expanded')) {
                    this.classList.remove('expanded');
                    // 편집 모드에서 일반 텍스트로 복구 (필요시)
                    const textarea = this.querySelector('textarea');
                    if (textarea) {
                        const contentDiv = document.createElement('div');
                        contentDiv.innerHTML = textarea.value.replace(/\n/g, '<br>');
                        textarea.parentNode.replaceChild(contentDiv, textarea);
                    }
                    return;
                }

                // 다른 카드들이 확대된 상태라면 모두 해제
                document.querySelectorAll('.card.expanded').forEach(expandedCard => {
                    expandedCard.classList.remove('expanded');
                });

                // 현재 카드 확대
                this.classList.add('expanded');

                // 편집 모드로 전환 (텍스트 영역 추가)
                const contentDiv = this.querySelector('.card-content');
                if (!contentDiv.querySelector('textarea')) {
                    const currentContent = contentDiv.innerHTML.replace(/<br>/g, '\n'); // <br> 태그를 개행 문자로 변환
                    contentDiv.innerHTML = ''; // 기존 내용 삭제
                    const textarea = document.createElement('textarea');
                    textarea.value = currentContent;
                    contentDiv.appendChild(textarea);
                }
            });
        });
    </script>

</body>
</html>
